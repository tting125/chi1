<!DOCTYPE html>
<html lang="zh-CN" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Clock & Particle Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            cyan: '#00f3ff',
                            pink: '#ff007f',
                            purple: '#9d00ff',
                            yellow: '#ffe600',
                            dark: '#0a0d14'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Glassmorphism Styles */
        .glass-panel {
            background: rgba(13, 17, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-panel-sm {
            background: rgba(20, 26, 42, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dynamic Glow Classes */
        .theme-glow-primary {
            text-shadow: 0 0 12px var(--primary-glow), 0 0 24px var(--primary-glow);
        }
        .theme-box-glow {
            box-shadow: 0 0 20px -3px var(--primary-glow-alpha);
        }

        /* Pulse animation for clock dots */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.92); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Canvas Overlay */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>

<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased select-none overflow-x-hidden relative">

    <!-- Interactive Canvas Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main App Container -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">

        <!-- Header Bar -->
        <header class="w-full max-w-7xl mx-auto glass-panel rounded-2xl px-5 py-4 mb-6 flex items-center justify-between transition-all duration-300">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid font-orbitron text-xl">⚡</i>
                </div>
                <div>
                    <h1 class="font-orbitron font-extrabold text-lg sm:text-xl tracking-wider text-white flex items-center gap-2">
                        CYBER<span id="header-accent-title" class="text-cyan-400">CHRONO</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-rajdhani tracking-widest uppercase">Particle & Focus Workstation</p>
                </div>
            </div>

            <!-- Header Quick Actions -->
            <div class="flex items-center gap-2 sm:gap-4">
                <!-- Sound Toggle -->
                <button id="btn-audio-toggle" onclick="toggleAmbientAudio()" class="glass-panel-sm hover:bg-white/10 px-3.5 py-2 rounded-xl text-slate-300 hover:text-white transition-all duration-200 flex items-center gap-2 text-sm border border-white/10">
                    <i id="audio-icon" class="fa-solid fa-volume-xmark text-pink-400"></i>
                    <span id="audio-text" class="hidden md:inline font-rajdhani font-semibold">环境音: 关</span>
                </button>

                <!-- Theme Quick Selector Pill -->
                <div class="relative hidden sm:block">
                    <select id="theme-select" onchange="changeTheme(this.value)" class="glass-panel-sm hover:bg-white/10 text-slate-200 text-sm font-rajdhani font-semibold py-2 pl-3 pr-8 rounded-xl appearance-none cursor-pointer focus:outline-none border border-white/10">
                        <option value="cyberpunk" class="bg-slate-900 text-cyan-400">⚡ 赛博霓虹 Cyberpunk</option>
                        <option value="synthwave" class="bg-slate-900 text-pink-400">🌅 日落复古 Synthwave</option>
                        <option value="matrix" class="bg-slate-900 text-emerald-400">💻 矩阵代码 Matrix</option>
                        <option value="monochrome" class="bg-slate-900 text-slate-200">⚪ 极简白夜 Monochrome</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                </div>

                <!-- Settings Drawer Toggle Button -->
                <button onclick="toggleSettingsDrawer()" class="glass-panel-sm hover:bg-white/10 p-2.5 rounded-xl text-slate-300 hover:text-white transition-all border border-white/10" title="控制面板">
                    <i class="fa-solid fa-sliders text-base"></i>
                </button>
            </div>
        </header>

        <!-- Main Dashboard Content Grid -->
        <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 my-auto">

            <!-- LEFT PANEL: Cyber Digital Clock (Cols 7) -->
            <section class="lg:col-span-7 glass-panel rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden transition-all duration-500 group">
                <!-- Background decorative glow -->
                <div id="clock-glow-bg" class="absolute -right-20 -top-20 w-72 h-72 rounded-full bg-cyan-500/10 blur-3xl pointer-events-none transition-all duration-700"></div>

                <!-- Top Status Bar in Clock Card -->
                <div class="flex items-center justify-between mb-6 z-10">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-rajdhani font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse mr-1.5"></span> SYSTEM LIVE
                        </span>
                        <span id="timezone-badge" class="text-xs text-slate-400 font-rajdhani tracking-wider">UTC+8</span>
                    </div>

                    <!-- 12h / 24h Switch -->
                    <button id="btn-format-toggle" onclick="toggleTimeFormat()" class="glass-panel-sm hover:bg-white/10 px-3 py-1 rounded-lg text-xs font-rajdhani font-bold tracking-wider text-slate-300 hover:text-white transition-all border border-white/10">
                        24 HOURS
                    </button>
                </div>

                <!-- Main Digital Clock Display -->
                <div class="my-auto py-4 text-center z-10">
                    <div class="inline-flex items-baseline justify-center font-orbitron font-extrabold tracking-tight">
                        <!-- Hours -->
                        <span id="clock-hours" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-white drop-shadow-[0_0_25px_rgba(0,243,255,0.4)]">
                            00
                        </span>

                        <!-- Separator -->
                        <span id="clock-dots" class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl mx-1 sm:mx-2 text-cyan-400 animate-pulse-fast">:</span>

                        <!-- Minutes -->
                        <span id="clock-minutes" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-white drop-shadow-[0_0_25px_rgba(0,243,255,0.4)]">
                            00
                        </span>

                        <!-- Seconds & AM/PM Column -->
                        <div class="flex flex-col items-start ml-2 sm:ml-4 text-left">
                            <span id="clock-ampm" class="text-xs sm:text-base font-bold font-rajdhani text-pink-500 tracking-widest hidden">AM</span>
                            <span id="clock-seconds" class="text-2xl sm:text-4xl lg:text-5xl font-bold text-cyan-400 font-orbitron drop-shadow-[0_0_15px_rgba(0,243,255,0.6)]">
                                00

                    </div>

                    <!-- Second Progress Bar Indicator -->
                    <div class="w-full max-w-md mx-auto bg-slate-900/60 rounded-full h-1.5 mt-6 p-0.5 overflow-hidden border border-white/5">
                        <div id="seconds-progress-bar" class="bg-gradient-to-r from-cyan-500 to-pink-500 h-full rounded-full transition-all duration-200" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Date & Info Footer -->
                <div class="pt-6 border-t border-white/10 flex flex-wrap items-center justify-between gap-4 z-10">
                    <div class="flex items-center gap-3">
                        <i class="fa-regular fa-calendar-days text-pink-400 text-lg"></i>
                        <div>
                            <div id="clock-date" class="font-rajdhani font-bold text-base sm:text-lg tracking-wide text-slate-100">2026年11月09日</div>
                            <div id="clock-day" class="text-xs text-slate-400 font-medium">星期一 • MON</div>
                        </div>
                    </div>

                    <!-- Interactive Mouse Visualizer Hint -->
                    <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400 font-rajdhani">
                        <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                        <span>移动鼠标连线 / 点击爆发粒子</span>
                    </div>
                </div>
            </section>

            <!-- RIGHT PANEL: Pomodoro Focus Workstation (Cols 5) -->
            <section class="lg:col-span-5 glass-panel rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden transition-all duration-500">

                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-orbitron font-bold text-base tracking-wider text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-stopwatch text-pink-500"></i> FOCUS TIMER
                    </h2>
                    <span id="pomo-streak-badge" class="px-2.5 py-0.5 rounded-full text-xs font-rajdhani font-bold bg-pink-500/10 text-pink-400 border border-pink-500/20">
                        ⚡ 专注次数: <span id="pomo-count">0</span>
                    </span>
                </div>

                <!-- Pomodoro Mode Selector Pills -->
                <div class="grid grid-cols-3 gap-2 p-1 bg-slate-950/50 rounded-xl mb-6 border border-white/5">
                    <button onclick="setPomodoroMode('focus')" id="pomo-btn-focus" class="pomo-mode-btn py-2 text-xs font-rajdhani font-bold rounded-lg transition-all bg-white/10 text-white shadow">
                        专注 (25m)
                    </button>
                    <button onclick="setPomodoroMode('short')" id="pomo-btn-short" class="pomo-mode-btn py-2 text-xs font-rajdhani font-bold rounded-lg transition-all text-slate-400 hover:text-white">
                        短休 (5m)
                    </button>
                    <button onclick="setPomodoroMode('long')" id="pomo-btn-long" class="pomo-mode-btn py-2 text-xs font-rajdhani font-bold rounded-lg transition-all text-slate-400 hover:text-white">
                        长休 (15m)
                    </button>
                </div>

                <!-- Circular Countdown Graphic Display -->
                <div class="relative w-48 h-48 sm:w-56 sm:h-56 mx-auto my-2 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <!-- Outer Background Circle -->
                        <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="5" class="text-slate-900" fill="transparent" />
                        <!-- Progress Circle -->
                        <circle id="pomo-progress-circle" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="5" 
                                class="text-cyan-400 transition-all duration-1000 ease-linear" 
                                fill="transparent" 
                                stroke-dasharray="263.89" 
                                stroke-dashoffset="0" 
                                stroke-linecap="round" />
                    </svg>

                    <!-- Center Time Display -->
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <span id="pomo-timer-display" class="font-orbitron font-extrabold text-4xl sm:text-5xl text-white tracking-wider drop-shadow-lg">
                            25:00
                        </span>
                        <span id="pomo-status-text" class="text-xs font-rajdhani font-bold uppercase tracking-widest text-slate-400 mt-1">
                            READY TO FOCUS
                        </span>
                    </div>
                </div>

                <!-- Pomodoro Controls -->
                <div class="flex items-center justify-center gap-4 mt-6">
                    <button id="pomo-btn-toggle" onclick="togglePomodoro()" class="flex-1 max-w-[140px] py-3 px-6 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-orbitron font-bold text-sm tracking-wider shadow-lg shadow-cyan-500/25 active:scale-95 transition-all">
                        START
                    </button>
                    <button onclick="resetPomodoro()" class="glass-panel-sm hover:bg-white/10 p-3 rounded-xl text-slate-300 hover:text-white active:scale-95 transition-all border border-white/10" title="重置计时器">
                        <i class="fa-solid fa-rotate-right text-base"></i>
                    </button>
                </div>
            </section>
        </main>

        <!-- Bottom Quick Dock / Control Toolbar -->
        <footer class="w-full max-w-7xl mx-auto glass-panel rounded-2xl p-4 mt-6 flex flex-wrap items-center justify-between gap-4 text-xs font-rajdhani text-slate-400">
            <div class="flex items-center gap-6">
                <!-- Particle Mode Toggle -->
                <div class="flex items-center gap-2">
                    <span class="text-slate-300 font-semibold">粒子模式:</span>
                    <button onclick="toggleParticleMode()" id="btn-particle-mode" class="glass-panel-sm hover:bg-white/10 px-3 py-1 rounded-lg text-cyan-400 font-bold border border-white/10">
                        🧲 引力 Attract
                    </button>
                </div>
                <!-- Manual Particle Burst Button -->
                <button onclick="triggerBurstWave()" class="glass-panel-sm hover:bg-white/10 px-3 py-1 rounded-lg text-pink-400 font-bold border border-white/10 flex items-center gap-1.5">
                    <i class="fa-solid fa-explosion"></i> 触发粒子爆发
                </button>
            </div>

            <!-- Ambient Sound Tone Selector -->
            <div class="flex items-center gap-3">
                <span class="text-slate-300 font-semibold hidden sm:inline">环境音类型:</span>
                <div class="flex items-center gap-1">
                    <button onclick="setSynthTone('cyber')" id="tone-cyber" class="synth-tone-btn px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-400 font-bold border border-cyan-500/30">
                        赛博低音
                    </button>
                    <button onclick="setSynthTone('deep')" id="tone-deep" class="synth-tone-btn px-2.5 py-1 rounded-md hover:bg-white/5 text-slate-400 font-bold">
                        深空静谧
                    </button>
                    <button onclick="setSynthTone('zen')" id="tone-zen" class="synth-tone-btn px-2.5 py-1 rounded-md hover:bg-white/5 text-slate-400 font-bold">
                        暖阳和弦
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Side Control Panel Modal / Drawer -->
    <div id="settings-drawer" class="fixed inset-y-0 right-0 w-full max-w-xs sm:max-w-sm glass-panel z-50 transform translate-x-full transition-transform duration-300 ease-in-out p-6 flex flex-col justify-between border-l border-white/10 shadow-2xl">
        <div>
            <!-- Drawer Header -->
            <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-6">
                <h3 class="font-orbitron font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-cyan-400"></i> 控制工作站
                </h3>
                <button onclick="toggleSettingsDrawer()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Settings Form Controls -->
            <div class="space-y-6">
                <!-- Theme Select Mobile -->
                <div class="block sm:hidden">
                    <label class="block text-xs font-rajdhani font-bold text-slate-300 uppercase tracking-wider mb-2">配色主题</label>
                    <select onchange="changeTheme(this.value)" class="w-full glass-panel-sm text-slate-200 text-sm font-rajdhani font-semibold p-2.5 rounded-xl border border-white/10">
                        <option value="cyberpunk" class="bg-slate-900 text-cyan-400">⚡ 赛博霓虹 Cyberpunk</option>
                        <option value="synthwave" class="bg-slate-900 text-pink-400">🌅 日落复古 Synthwave</option>
                        <option value="matrix" class="bg-slate-900 text-emerald-400">💻 矩阵代码 Matrix</option>
                        <option value="monochrome" class="bg-slate-900 text-slate-200">⚪ 极简白夜 Monochrome</option>
                    </select>
                </div>

                <!-- Particle Density -->
                <div>
                    <div class="flex justify-between text-xs font-rajdhani font-bold text-slate-300 mb-2">
                        <span>粒子数量</span>
                        <span id="val-particle-count" class="text-cyan-400">90</span>
                    </div>
                    <input type="range" id="slider-particle-count" min="30" max="180" value="90" oninput="updateParticleCount(this.value)" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Particle Speed -->
                <div>
                    <div class="flex justify-between text-xs font-rajdhani font-bold text-slate-300 mb-2">
                        <span>粒子移动速度</span>
                        <span id="val-particle-speed" class="text-cyan-400">1.0x</span>
                    </div>
                    <input type="range" id="slider-particle-speed" min="0.2" max="3.0" step="0.2" value="1.0" oninput="updateParticleSpeed(this.value)" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Connection Distance -->
                <div>
                    <div class="flex justify-between text-xs font-rajdhani font-bold text-slate-300 mb-2">
                        <span>连线触及距离</span>
                        <span id="val-connect-dist" class="text-cyan-400">120px</span>
                    </div>
                    <input type="range" id="slider-connect-dist" min="60" max="220" value="120" oninput="updateConnectDistance(this.value)" class="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Audio Master Volume -->
                <div>
                    <div class="flex justify-between text-xs font-rajdhani font-bold text-slate-300 mb-2">
                        <span>环境音效音量</span>
                        <span id="val-volume" class="text-pink-400">50%</span>
                    </div>
                    <input type="range" id="slider-volume" min="0" max="100" value="50" oninput="updateMasterVolume(this.value)" class="w-full accent-pink-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Drawer Footer Info -->
        <div class="pt-6 border-t border-white/10 text-center">
            <p class="text-xs text-slate-500 font-rajdhani">CYBER CHRONO ENGINE v2.5</p>
            <p class="text-[10px] text-slate-600 font-mono mt-1">Web Audio API • Canvas 2D • Tailwind CSS</p>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================================================
           1. COLOR THEMES & CONFIGURATION
           ========================================================================== */
        const THEMES = {
            cyberpunk: {
                name: '赛博霓虹',
                bgClass: 'bg-slate-950',
                primary: '#00f3ff',
                primaryGlow: 'rgba(0, 243, 255, 0.5)',
                secondary: '#ff007f',
                secondaryGlow: 'rgba(255, 0, 127, 0.5)',
                particles: ['#00f3ff', '#ff007f', '#9d00ff', '#ffe600'],
                lineColor: '0, 243, 255'
            },
            synthwave: {
                name: '日落复古',
                bgClass: 'bg-indigo-950',
                primary: '#ff7e5f',
                primaryGlow: 'rgba(255, 126, 95, 0.5)',
                secondary: '#feb47b',
                secondaryGlow: 'rgba(254, 180, 123, 0.5)',
                particles: ['#ff7e5f', '#feb47b', '#d7385e', '#ff2a74'],
                lineColor: '255, 126, 95'
            },
            matrix: {
                name: '矩阵代码',
                bgClass: 'bg-black',
                primary: '#00ff66',
                primaryGlow: 'rgba(0, 255, 102, 0.5)',
                secondary: '#00cc44',
                secondaryGlow: 'rgba(0, 204, 68, 0.5)',
                particles: ['#00ff66', '#00cc44', '#003311', '#ccffdd'],
                lineColor: '0, 255, 102'
            },
            monochrome: {
                name: '极简白夜',
                bgClass: 'bg-neutral-950',
                primary: '#ffffff',
                primaryGlow: 'rgba(255, 255, 255, 0.6)',
                secondary: '#94a3b8',
                secondaryGlow: 'rgba(148, 163, 184, 0.4)',
                particles: ['#ffffff', '#cbd5e1', '#64748b', '#38bdf8'],
                lineColor: '255, 255, 255'
            }
        };

        let currentThemeKey = 'cyberpunk';
        let is24HourFormat = true;

        /* ==========================================================================
           2. WEB AUDIO API SYNTHESIZER (No external sound files required)
           ========================================================================== */
        class WebAudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.ambientGain = null;
                this.oscillators = [];
                this.isPlayingAmbient = false;
                this.currentTone = 'cyber'; // 'cyber', 'deep', 'zen'
                this.volume = 0.5;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);

                    this.ambientGain = this.ctx.createGain();
                    this.ambientGain.gain.setValueAtTime(0, this.ctx.currentTime);
                    this.ambientGain.connect(this.masterGain);
                }

                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Short futuristic UI click sound
            playClickSound() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);

                    gain.gain.setValueAtTime(0.15 * this.volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                    osc.connect(gain);
                    gain.connect(this.masterGain);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }

            // Alarm Chime Sound for Pomodoro completion
            playAlarmSound() {
                if (!this.ctx) this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);

                    gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.12);
                    gain.gain.linearRampToValueAtTime(0.2 * this.volume, this.ctx.currentTime + idx * 0.12 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.8);

                    osc.connect(gain);
                    gain.connect(this.masterGain);

                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.8);
                });
            }

            // Continuous Relaxing Synthesizer Drone
            toggleAmbient() {
                this.init();
                if (this.isPlayingAmbient) {
                    this.stopAmbient();
                } else {
                    this.startAmbient();
                }
                return this.isPlayingAmbient;
            }

            startAmbient() {
                if (this.isPlayingAmbient) return;
                this.oscillators = [];

                let freqs = [65.41, 98.00, 130.81]; // C2, G2, C3 (Cyber Drone)
                if (this.currentTone === 'deep') freqs = [55.00, 82.41, 110.00]; // A1, E2, A2
                if (this.currentTone === 'zen') freqs = [174.61, 220.00, 261.63]; // F3, A3, C4

                freqs.forEach(freq => {
                    const osc = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();

                    osc.type = this.currentTone === 'zen' ? 'sine' : 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(350, this.ctx.currentTime);

                    osc.connect(filter);
                    filter.connect(this.ambientGain);

                    osc.start();
                    this.oscillators.push(osc);
                });

                // Fade in ambient volume
                this.ambientGain.gain.linearRampToValueAtTime(0.25 * this.volume, this.ctx.currentTime + 1.5);
                this.isPlayingAmbient = true;
            }

            stopAmbient() {
                if (!this.isPlayingAmbient) return;
                this.ambientGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                setTimeout(() => {
                    this.oscillators.forEach(osc => {
                        try { osc.stop(); } catch(e) {}
                    });
                    this.oscillators = [];
                    this.isPlayingAmbient = false;
                }, 800);
            }

            setVolume(val) {
                this.volume = val;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                }
            }

            setTone(toneType) {
                this.currentTone = toneType;
                if (this.isPlayingAmbient) {
                    this.stopAmbient();
                    setTimeout(() => this.startAmbient(), 900);
                }
            }
        }

        const audioApp = new WebAudioEngine();

        /* ==========================================================================
           3. CANVAS INTERACTIVE PARTICLE SYSTEM
           ========================================================================== */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };
        let particleConfig = {
            count: 90,
            speed: 1.0,
            connectDistance: 120,
            mode: 'attract' // 'attract' or 'repel'
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse & Touch Tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Click Burst Event
        window.addEventListener('click', (e) => {
            // Avoid burst if clicking buttons or UI inputs
            if (e.target.closest('button, select, input, a')) return;
            audioApp.playClickSound();
            createBurst(e.clientX, e.clientY);
        });

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                
                const speedMult = particleConfig.speed;
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const force = Math.random() * 6 + 2;
                    this.vx = Math.cos(angle) * force;
                    this.vy = Math.sin(angle) * force;
                    this.size = Math.random() * 4 + 2;
                    this.life = 1.0;
                    this.isBurst = true;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.5 * speedMult;
                    this.vy = (Math.random() - 0.5) * 1.5 * speedMult;
                    this.size = Math.random() * 2.5 + 1;
                    this.life = 1.0;
                    this.isBurst = false;
                }

                const palette = THEMES[currentThemeKey].particles;
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            update() {
                this.x += this.vx * particleConfig.speed;
                this.y += this.vy * particleConfig.speed;

                if (this.isBurst) {
                    this.life -= 0.02;
                    this.size *= 0.96;
                } else {
                    // Bounce off walls
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    // Mouse Attraction / Repulsion Logic
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < mouse.radius) {
                            const force = (mouse.radius - dist) / mouse.radius;
                            const angle = Math.atan2(dy, dx);
                            const dir = particleConfig.mode === 'attract' ? 1 : -1;

                            this.x += Math.cos(angle) * force * 3 * dir;
                            this.y += Math.sin(angle) * force * 3 * dir;
                        }
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleConfig.count; i++) {
                particles.push(new Particle());
            }
        }

        function createBurst(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        function drawLines() {
            const rgb = THEMES[currentThemeKey].lineColor;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < particleConfig.connectDistance) {
                        const alpha = (1 - dist / particleConfig.connectDistance) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(${rgb}, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.isBurst && p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            drawLines();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        /* ==========================================================================
           4. CYBER DIGITAL CLOCK LOGIC
           ========================================================================== */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            let ampm = '';

            if (!is24HourFormat) {
                ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
            }
            hours = String(hours).padStart(2, '0');

            document.getElementById('clock-hours').textContent = hours;
            document.getElementById('clock-minutes').textContent = minutes;
            document.getElementById('clock-seconds').textContent = seconds;

            const ampmEl = document.getElementById('clock-ampm');
            if (is24HourFormat) {
                ampmEl.classList.add('hidden');
            } else {
                ampmEl.classList.remove('hidden');
                ampmEl.textContent = ampm;
            }

            // Update Seconds Progress Bar
            const secPercent = (now.getSeconds() / 60) * 100;
            document.getElementById('seconds-progress-bar').style.width = `${secPercent}%`;

            // Date & Weekday Formatting
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const daysEn = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const daysCn = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

            document.getElementById('clock-date').textContent = `${year}年${month}月${date}日`;
            document.getElementById('clock-day').textContent = `${daysCn[now.getDay()]} • ${daysEn[now.getDay()]}`;
        }

        function toggleTimeFormat() {
            audioApp.playClickSound();
            is24HourFormat = !is24HourFormat;
            document.getElementById('btn-format-toggle').textContent = is24HourFormat ? '24 HOURS' : '12 HOURS';
            updateClock();
        }

        setInterval(updateClock, 1000);
        updateClock();

        /* ==========================================================================
           5. POMODORO FOCUS TIMER LOGIC
           ========================================================================== */
        let pomoState = {
            totalSeconds: 25 * 60,
            remainingSeconds: 25 * 60,
            isRunning: false,
            intervalId: null,
            mode: 'focus', // 'focus', 'short', 'long'
            streak: 0
        };

        const pomoDurations = {
            focus: 25 * 60,
            short: 5 * 60,
            long: 15 * 60
        };

        const circleRadius = 42;
        const circleCircumference = 2 * Math.PI * circleRadius;

        function updatePomoDisplay() {
            const mins = Math.floor(pomoState.remainingSeconds / 60);
            const secs = pomoState.remainingSeconds % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            document.getElementById('pomo-timer-display').textContent = formatted;

            // Update Circular SVG stroke-dashoffset
            const progress = pomoState.remainingSeconds / pomoState.totalSeconds;
            const offset = circleCircumference * (1 - progress);
            document.getElementById('pomo-progress-circle').style.strokeDashoffset = offset;
        }

        function setPomodoroMode(mode) {
            audioApp.playClickSound();
            pomoState.mode = mode;
            pomoState.totalSeconds = pomoDurations[mode];
            pomoState.remainingSeconds = pomoDurations[mode];

            if (pomoState.isRunning) {
                clearInterval(pomoState.intervalId);
                pomoState.isRunning = false;
                document.getElementById('pomo-btn-toggle').textContent = 'START';
            }

            // Update UI Tab active styles
            document.querySelectorAll('.pomo-mode-btn').forEach(btn => {
                btn.classList.remove('bg-white/10', 'text-white', 'shadow');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`pomo-btn-${mode}`);
            activeBtn.classList.add('bg-white/10', 'text-white', 'shadow');
            activeBtn.classList.remove('text-slate-400');

            document.getElementById('pomo-status-text').textContent = 
                mode === 'focus' ? 'READY TO FOCUS' : mode === 'short' ? 'SHORT BREAK TIME' : 'LONG BREAK TIME';

            updatePomoDisplay();
        }

        function togglePomodoro() {
            audioApp.playClickSound();
            if (pomoState.isRunning) {
                // Pause
                clearInterval(pomoState.intervalId);
                pomoState.isRunning = false;
                document.getElementById('pomo-btn-toggle').textContent = 'RESUME';
                document.getElementById('pomo-status-text').textContent = 'TIMER PAUSED';
            } else {
                // Start / Resume
                pomoState.isRunning = true;
                document.getElementById('pomo-btn-toggle').textContent = 'PAUSE';
                document.getElementById('pomo-status-text').textContent = 
                    pomoState.mode === 'focus' ? 'FOCUSING...' : 'RELAXING...';

                pomoState.intervalId = setInterval(() => {
                    if (pomoState.remainingSeconds > 0) {
                        pomoState.remainingSeconds--;
                        updatePomoDisplay();
                    } else {
                        // Countdown Complete
                        clearInterval(pomoState.intervalId);
                        pomoState.isRunning = false;
                        document.getElementById('pomo-btn-toggle').textContent = 'START';

                        // Play alarm chime sound & trigger screen particle explosion
                        audioApp.playAlarmSound();
                        triggerBurstWave();

                        if (pomoState.mode === 'focus') {
                            pomoState.streak++;
                            document.getElementById('pomo-count').textContent = pomoState.streak;
                            document.getElementById('pomo-status-text').textContent = 'FOCUS SESSION DONE!';
                        } else {
                            document.getElementById('pomo-status-text').textContent = 'BREAK ENDED!';
                        }
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            audioApp.playClickSound();
            if (pomoState.isRunning) {
                clearInterval(pomoState.intervalId);
                pomoState.isRunning = false;
            }
            pomoState.remainingSeconds = pomoState.totalSeconds;
            document.getElementById('pomo-btn-toggle').textContent = 'START';
            document.getElementById('pomo-status-text').textContent = 'TIMER RESET';
            updatePomoDisplay();
        }

        updatePomoDisplay();

        /* ==========================================================================
           6. INTERACTIVE ACTIONS & THEME SWITCHING
           ========================================================================== */
        function changeTheme(themeKey) {
            audioApp.playClickSound();
            if (!THEMES[themeKey]) return;
            currentThemeKey = themeKey;
            const theme = THEMES[themeKey];

            // Re-assign CSS variables for glowing effects
            document.documentElement.style.setProperty('--primary-glow', theme.primaryGlow);
            document.documentElement.style.setProperty('--primary-glow-alpha', theme.primaryGlow);

            // Update DOM element accents
            document.getElementById('header-accent-title').style.color = theme.primary;
            document.getElementById('clock-glow-bg').style.backgroundColor = theme.primaryGlow;
            document.getElementById('pomo-progress-circle').style.color = theme.primary;

            // Re-init particle colors
            initParticles();
        }

        function toggleAmbientAudio() {
            const isPlaying = audioApp.toggleAmbient();
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-text');

            if (isPlaying) {
                icon.className = 'fa-solid fa-volume-high text-cyan-400 animate-pulse';
                text.textContent = '环境音: 开';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-pink-400';
                text.textContent = '环境音: 关';
            }
        }

        function setSynthTone(toneType) {
            audioApp.playClickSound();
            audioApp.setTone(toneType);
            document.querySelectorAll('.synth-tone-btn').forEach(btn => {
                btn.className = 'synth-tone-btn px-2.5 py-1 rounded-md hover:bg-white/5 text-slate-400 font-bold';
            });
            const activeBtn = document.getElementById(`tone-${toneType}`);
            activeBtn.className = 'synth-tone-btn px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-400 font-bold border border-cyan-500/30';
        }

        function toggleParticleMode() {
            audioApp.playClickSound();
            particleConfig.mode = particleConfig.mode === 'attract' ? 'repel' : 'attract';
            const btn = document.getElementById('btn-particle-mode');
            if (particleConfig.mode === 'attract') {
                btn.innerHTML = '🧲 引力 Attract';
                btn.className = 'glass-panel-sm hover:bg-white/10 px-3 py-1 rounded-lg text-cyan-400 font-bold border border-white/10';
            } else {
                btn.innerHTML = '💥 斥力 Repel';
                btn.className = 'glass-panel-sm hover:bg-white/10 px-3 py-1 rounded-lg text-pink-400 font-bold border border-white/10';
            }
        }

        function triggerBurstWave() {
            createBurst(canvas.width / 2, canvas.height / 2);
            createBurst(canvas.width / 3, canvas.height / 3);
            createBurst((canvas.width / 3) * 2, (canvas.height / 3) * 2);
        }

        function toggleSettingsDrawer() {
            audioApp.playClickSound();
            const drawer = document.getElementById('settings-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        /* Settings Inputs Listeners */
        function updateParticleCount(val) {
            document.getElementById('val-particle-count').textContent = val;
            particleConfig.count = parseInt(val);
            initParticles();
        }

        function updateParticleSpeed(val) {
            document.getElementById('val-particle-speed').textContent = `${val}x`;
            particleConfig.speed = parseFloat(val);
        }

        function updateConnectDistance(val) {
            document.getElementById('val-connect-dist').textContent = `${val}px`;
            particleConfig.connectDistance = parseInt(val);
        }

        function updateMasterVolume(val) {
            document.getElementById('val-volume').textContent = `${val}%`;
            audioApp.setVolume(parseInt(val) / 100);
        }
    </script>
</body>
